[versions]
lucene = "10.5.2"
# Older Lucene versions, only for writing test indexes (leia-core/build.gradle.kts)
lucene9 = "9.12.3"
lucene8 = "8.11.4"
# Reads Lucene 2.x and 3.x indexes, relocated in leia-lucene3 (ADR 0044)
lucene3 = "3.6.2"
# Only for writing the Lucene 2.4 test index (leia-lucene3/build.gradle.kts)
lucene24 = "2.4.1"
# Reads Lucene 4.x and 5.x indexes, relocated in leia-lucene5 (ADR 0046)
lucene5 = "5.5.5"
# Only for writing the Lucene 4.x test index (leia-lucene5/build.gradle.kts)
lucene4 = "4.10.4"
# Reads Lucene 6.x and 7.x indexes, relocated in leia-lucene7 (ADR 0048)
lucene7 = "7.7.3"
# Only for writing the Lucene 6.x test index (leia-lucene7/build.gradle.kts)
lucene6 = "6.6.6"
dagger = "2.60.1"
jackson = "3.2.3"
junit = "6.1.3"
assertj = "3.27.7"
palantirJavaFormat = "2.102.0"
spotless = "8.10.3"
shadow = "9.6.1"
# Pinned: an upgrade is a change of its own (ADR 0034)
tamboui = "0.5.0"

[libraries]
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-backward-codecs = { module = "org.apache.lucene:lucene-backward-codecs", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }
lucene-queries = { module = "org.apache.lucene:lucene-queries", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-highlighter = { module = "org.apache.lucene:lucene-highlighter", version.ref = "lucene" }
# Codecs and formats that are bundled, so that indexes using them open (ADR 0018)
lucene-codecs = { module = "org.apache.lucene:lucene-codecs", version.ref = "lucene" }
lucene-suggest = { module = "org.apache.lucene:lucene-suggest", version.ref = "lucene" }
# Analysis modules that are not bundled, only for testing analysis jars (ADR 0016)
lucene-analysis-phonetic = { module = "org.apache.lucene:lucene-analysis-phonetic", version.ref = "lucene" }
lucene-analysis-stempel = { module = "org.apache.lucene:lucene-analysis-stempel", version.ref = "lucene" }
# Kuromoji and Nori, for the options of their analyzers (ADR 0023)
lucene-analysis-kuromoji = { module = "org.apache.lucene:lucene-analysis-kuromoji", version.ref = "lucene" }
lucene-analysis-nori = { module = "org.apache.lucene:lucene-analysis-nori", version.ref = "lucene" }
# ICU, for the collators of its collation analyzer (ADR 0038)
lucene-analysis-icu = { module = "org.apache.lucene:lucene-analysis-icu", version.ref = "lucene" }
lucene9-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene9" }
lucene8-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene8" }
lucene3-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene3" }
lucene24-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene24" }
lucene5-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene5" }
lucene5-backward-codecs = { module = "org.apache.lucene:lucene-backward-codecs", version.ref = "lucene5" }
lucene5-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene5" }
lucene5-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene5" }
lucene4-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene4" }
lucene4-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene4" }
lucene7-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene7" }
lucene7-backward-codecs = { module = "org.apache.lucene:lucene-backward-codecs", version.ref = "lucene7" }
lucene7-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene7" }
lucene7-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene7" }
lucene6-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene6" }
lucene6-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene6" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
tamboui-bom = { module = "dev.tamboui:tamboui-bom", version.ref = "tamboui" }
tamboui-core = { module = "dev.tamboui:tamboui-core" }
tamboui-widgets = { module = "dev.tamboui:tamboui-widgets" }
tamboui-tui = { module = "dev.tamboui:tamboui-tui" }
tamboui-jline3-backend = { module = "dev.tamboui:tamboui-jline3-backend" }
tamboui-panama-backend = { module = "dev.tamboui:tamboui-panama-backend" }
# Gradle plugins used as libraries by build-logic
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
