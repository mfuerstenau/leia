[package]
name = "leia"
version = "0.1.0-SNAPSHOT"
edition = "2024"
description = "Read-only Lucene index inspector (terminal UI)"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# line_count sizes the open prompt to its wrapped error message.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The viewer wraps text by display width; ratatui uses the same crate.
unicode-width = "0.2.2"

[profile.release]
strip = true
