# Read by the sonar-check skill (ADR 0088). It holds the skill's own settings and sonar.* analysis
# properties, which the skill passes to the scanner on each scan.

# Conditions of SonarQube's "Sonar way" gate that this build's quality gate leaves out, by metric
# key, comma-separated.
qualityGate.without=new_duplicated_lines_density

# The rules ADR 0088 accepts as a broad decision, by its "Accepted" table. Single sites are
# accepted with @SuppressWarnings in the code instead. kotlin:S6474, which sits on the project and
# which no resourceKey matches, is settled by gradle/verification-metadata.xml (ADR 0089).
sonar.issue.ignore.multicriteria=s6878,s108,s6916,s2094,s1452,s2143,s7475
# S6878 record patterns: house style
sonar.issue.ignore.multicriteria.s6878.ruleKey=java:S6878
sonar.issue.ignore.multicriteria.s6878.resourceKey=**/*.java
# S108 empty block: the default -> {} of a key switch
sonar.issue.ignore.multicriteria.s108.ruleKey=java:S108
sonar.issue.ignore.multicriteria.s108.resourceKey=leia-tui/**/*.java
# S6916 when guard: switches over enum or char constants
sonar.issue.ignore.multicriteria.s6916.ruleKey=java:S6916
sonar.issue.ignore.multicriteria.s6916.resourceKey=leia-tui/**/*.java
# S2094 empty class: the empty *Params records (hard rule 3)
sonar.issue.ignore.multicriteria.s2094.ruleKey=java:S2094
sonar.issue.ignore.multicriteria.s2094.resourceKey=leia-protocol/**/*.java
# S1452 wildcard return types: Dagger's MethodHandler<?, ?> sets
sonar.issue.ignore.multicriteria.s1452.ruleKey=java:S1452
sonar.issue.ignore.multicriteria.s1452.resourceKey=**/server/HandlerModule.java
# S2143 java.util.Date: Lucene's DateTools takes a Date
sonar.issue.ignore.multicriteria.s2143.ruleKey=java:S2143
sonar.issue.ignore.multicriteria.s2143.resourceKey=**/*DateRange*.java
# S7475 unused record components: Palantir can't format a bare _
sonar.issue.ignore.multicriteria.s7475.ruleKey=java:S7475
sonar.issue.ignore.multicriteria.s7475.resourceKey=**/tui/check/Check.java
